name: Deploy Mainnet Public

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY XRPL GROUP PAY MAINNET PUBLIC
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: xrpl-group-pay-mainnet-halted-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and verify public Mainnet target
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: mainnet-public-deployment
      url: https://xgp.badjoke-lab.com
    steps:
      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"

      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify approved public deployment state
        run: |
          pnpm check:production-target
          pnpm check:mainnet-release-plan
          node scripts/check-mainnet-release-evidence.mjs --require-complete
          node scripts/check-mainnet-acceptance.mjs --require-ready
          node scripts/check-mainnet-gate.mjs --require-mainnet

      - name: Deploy, verify, and fail closed
        env:
          MAINNET_PUBLIC_DEPLOYMENT_CONFIRMATION: ${{ inputs.confirmation }}
          MAINNET_PUBLIC_DEPLOYMENT_REPORT_PATH: ${{ runner.temp }}/mainnet-public-deployment-report.json
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAINNET_XAMAN_API_KEY: ${{ secrets.MAINNET_XAMAN_API_KEY }}
          MAINNET_XAMAN_API_SECRET: ${{ secrets.MAINNET_XAMAN_API_SECRET }}
        run: node scripts/run-mainnet-public-deployment.mjs

      - name: Upload public-safe deployment report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-public-deployment-${{ github.run_id }}
          path: ${{ runner.temp }}/mainnet-public-deployment-report.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure and rollback diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-public-deployment-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mainnet-public-deployment-stage.json
            ${{ runner.temp }}/mainnet-public-deployment-rollback-report.json
            ${{ runner.temp }}/wrangler-output.ndjson
          if-no-files-found: warn
          retention-days: 7
